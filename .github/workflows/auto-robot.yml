name: Auto Robot Cron

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: auto-robot
  cancel-in-progress: false

jobs:
  run-auto-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Wav2Lip
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          git clone https://github.com/Rudrabha/Wav2Lip.git
          wget -O Wav2Lip/checkpoints/wav2lip_gan.pth https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth
          pip install torch torchvision torchaudio opencv-python-headless librosa==0.9.2 numpy==1.23.5 tqdm face_alignment==1.3.5 imageio imageio-ffmpeg


      - name: Run Auto Robot Script
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} 
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/auto-robot-click.js

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Always upload artifacts even if it fails
        with:
          name: auto-robot-artifacts
          path: artifacts/
          retention-days: 7
